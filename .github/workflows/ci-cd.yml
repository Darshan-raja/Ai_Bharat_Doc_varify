# .github/workflows/ci-cd.yml
#
# BharatVerify — CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────
# Triggers:
#   • Every push to "main"  → full build + push to Docker Hub
#   • Every Pull Request    → lint & test only (no push)
# ─────────────────────────────────────────────────────────────────

name: BharatVerify CI/CD

# ══════════════════════════════════════════════════════════════════
# WHEN does this pipeline run?
# ══════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main          # Run on every commit pushed to the main branch
  pull_request:
    branches:
      - main          # Run on every PR targeting main (test-only)

# ══════════════════════════════════════════════════════════════════
# ENV — shared across all jobs
# ══════════════════════════════════════════════════════════════════
env:
  # Your Docker Hub username (set this in GitHub → Settings → Secrets)
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

# ══════════════════════════════════════════════════════════════════
# JOB 1 — Lint & Test the Backend
# ══════════════════════════════════════════════════════════════════
jobs:
  test-backend:
    name: 🧪 Backend — Lint & Test
    runs-on: ubuntu-latest   # GitHub provides a fresh Ubuntu VM for free

    steps:
      # ── Step 1: Download your repository code onto the runner VM ──
      - name: Checkout code
        uses: actions/checkout@v4
        # "actions/checkout@v4" is a pre-built action by GitHub that
        # does a "git clone" of your repository into the runner

      # ── Step 2: Install Node.js on the runner ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"           # Match what your backend uses
          cache: "npm"                 # Cache node_modules for faster future runs
          cache-dependency-path: backend/package-lock.json

      # ── Step 3: Install backend dependencies ──
      - name: Install backend dependencies
        working-directory: backend     # cd into the backend folder
        run: npm ci
        # "npm ci" is like "npm install" but:
        # - uses package-lock.json exactly (reproducible builds)
        # - faster in CI environments

      # ── Step 4: Run tests (will print a warning since no tests exist yet) ──
      - name: Run backend tests
        working-directory: backend
        run: npm test || true
        # "|| true" means: even if the test command fails/has no tests,
        # don't fail the pipeline. Remove this once you add real tests!

  # ══════════════════════════════════════════════════════════════════
  # JOB 2 — Lint & Build the Frontend
  # ══════════════════════════════════════════════════════════════════
  test-frontend:
    name: 🎨 Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ── Lint checks (ESLint) — catches code quality issues ──
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint || true
        # Linting checks your code for mistakes before it runs

      # ── Production build — makes sure the code compiles correctly ──
      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build
        env:
          # Use a placeholder URL during the CI build
          VITE_API_URL: http://localhost:5000

  # ══════════════════════════════════════════════════════════════════
  # JOB 3 — Build & Push Docker Images to Docker Hub
  # Only runs when code is merged/pushed to "main" (not on PRs)
  # ══════════════════════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    # This job only runs after BOTH test jobs pass
    needs: [test-backend, test-frontend]

    # Only run on the main branch (not on pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # ── Step 1: Download the code ──
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Docker Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx is Docker's advanced build system:
        # - Supports multi-platform builds (amd64 + arm64)
        # - Enables better build caching
        # - Required for the build-push-action below

      # ── Step 3: Log in to Docker Hub ──
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          # These secrets are stored in GitHub → Settings → Secrets & variables
          # NEVER put your password directly in this file

      # ── Step 4: Extract metadata (tags & labels) ──
      # This creates tags like:  yourusername/bharatverify-backend:latest
      #                           yourusername/bharatverify-backend:sha-abc1234
      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/bharatverify-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/bharatverify-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Docker metadata (forge-detection)
        id: meta-forge
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/bharatverify-forge-detection
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Docker metadata (ocr-api)
        id: meta-ocr
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/bharatverify-ocr-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Step 5: Build & Push — Backend ──
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend          # Use ./backend folder as build context
          dockerfile: ./devops/Dockerfile.backend
          push: true                  # Actually push to Docker Hub
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha       # Use GitHub Actions cache to speed up builds
          cache-to: type=gha,mode=max

      # ── Step 6: Build & Push — Frontend ──
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./devops/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      # ── Step 7: Build & Push — Forge Detection ML Service ──
      - name: Build and push Forge Detection image
        uses: docker/build-push-action@v5
        with:
          context: ./ML/forge_detection
          dockerfile: ./devops/Dockerfile.forge_detection
          push: true
          tags: ${{ steps.meta-forge.outputs.tags }}
          labels: ${{ steps.meta-forge.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NOTE: PyTorch image is large (~2 GB). The GHA cache helps a lot here.

      # ── Step 8: Build & Push — OCR API ML Service ──
      - name: Build and push OCR API image
        uses: docker/build-push-action@v5
        with:
          context: ./ML/OCR_api
          dockerfile: ./devops/Dockerfile.ocr_api
          push: true
          tags: ${{ steps.meta-ocr.outputs.tags }}
          labels: ${{ steps.meta-ocr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════
  # JOB 4 — Deploy (template — fill in your hosting platform)
  # ══════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Option A: Deploy to a VPS / server via SSH ──
      # Uncomment this block and add SSH_HOST, SSH_USER, SSH_PRIVATE_KEY to secrets
      #
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /opt/bharatverify
      #       docker compose pull          # Pull the latest images from Docker Hub
      #       docker compose up -d         # Restart containers in the background
      #       docker system prune -f       # Clean up old images to free disk space

      # ── Option B: Deploy backend to Render (via Deploy Hook URL) ──
      # - name: Trigger Render Deploy (backend)
      #   run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # ── Option C: Deploy frontend to Vercel ──
      # - name: Deploy frontend to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: ./frontend

      # Placeholder step so the job doesn't fail while you configure deployment
      - name: Deployment placeholder
        run: |
          echo "✅ Images are pushed to Docker Hub."
          echo "👉 Configure your deployment target above (SSH / Render / Vercel)."
          echo "   Backend image : ${{ secrets.DOCKER_HUB_USERNAME }}/bharatverify-backend:latest"
          echo "   Frontend image: ${{ secrets.DOCKER_HUB_USERNAME }}/bharatverify-frontend:latest"
